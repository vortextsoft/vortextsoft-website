<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- ── Viewport & Rendering ───────────────────────────────────────── -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- ── Favicons & Google Search Icon ───────────────────────────── -->
  <link rel="icon" type="image/png" sizes="192x192" href="/vortextsoft-3d-logo.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/vortextsoft-3d-logo.png" />
  <link rel="shortcut icon" href="/vortextsoft-3d-logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/vortextsoft-3d-logo.png" />

  <!-- ── Default SEO (overridden per-page by react-helmet-async) ────── -->
  <title>Vortextsoft — Innovative Software Solutions</title>
  <meta name="description"
    content="Vortextsoft delivers cutting-edge, scalable software solutions — AI/ML, web, mobile, ERP, IoT and more. Empowering businesses with high-performance technology." />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="Vortextsoft" />
  <link rel="canonical" href="https://vortextsoft.com/" />

  <!-- ── Open Graph (default fallback) ─────────────────────────────── -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://vortextsoft.com/" />
  <meta property="og:title" content="Vortextsoft — Innovative Software Solutions" />
  <meta property="og:description"
    content="Vortextsoft delivers cutting-edge, scalable software solutions — AI/ML, web, mobile, ERP, IoT and more." />
  <meta property="og:image" content="https://vortextsoft.com/vortextsoft-3d-logo.png" />
  <meta property="og:site_name" content="Vortextsoft" />
  <meta property="og:locale" content="en_US" />

  <!-- ── Twitter Card (default fallback) ───────────────────────────── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@vortextsoft" />
  <meta name="twitter:title" content="Vortextsoft — Innovative Software Solutions" />
  <meta name="twitter:description"
    content="Vortextsoft delivers cutting-edge, scalable software solutions — AI/ML, web, mobile, ERP, IoT and more." />
  <meta name="twitter:image" content="https://vortextsoft.com/vortextsoft-3d-logo.png" />

  <!-- ── Performance / Core Web Vitals ─────────────────────────────── -->
  <!-- Preconnect to speed up Google Fonts if used in CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- ── JSON-LD Structured Data (Organization) ────────────────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Vortextsoft",
    "url": "https://vortextsoft.com",
    "logo": "https://vortextsoft.com/vortextsoft-logo-new.png",
    "description": "Vortextsoft delivers cutting-edge AI/ML, web, mobile, ERP and IoT software solutions.",
    "contactPoint": {
      "@type": "ContactPoint",
      "email": "vortextsoft.info@gmail.com",
      "contactType": "customer service"
    },
    "sameAs": []
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
